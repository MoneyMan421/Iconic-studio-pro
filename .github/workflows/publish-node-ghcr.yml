name: Publish (Node.js → GHCR)

on:
  workflow_dispatch:
    inputs:
      working-directory:
        description: Directory containing the Dockerfile (and your Node.js app)
        required: false
        default: .
        type: string
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".github/workflows/publish-node-ghcr.yml"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      ${{
        hashFiles(
          format(
            '{0}/Dockerfile',
            github.event_name == 'workflow_dispatch' && inputs.working-directory || vars.DOCKER_WORKDIR || '.'
          )
        ) != ''
      }}
    env:
      WORKDIR: ${{ github.event_name == 'workflow_dispatch' && inputs.working-directory || vars.DOCKER_WORKDIR || '.' }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          file: ${{ env.WORKDIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

